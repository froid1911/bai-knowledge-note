name: Vetra
on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
    types: [opened, synchronize, reopened]
permissions:
  id-token: write
  contents: read
concurrency:
  group: vetra-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true
jobs:
  deploy:
    # Skip pull requests opened from another repository: they must not reach the
    # OIDC token. Compare full names rather than asking whether the head repo is
    # a fork, which is true for every PR when this repository is itself a fork.
    if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
      # bun installs the dependencies, but the build still runs Node tooling
      # (ph-cli, scripts/*.mjs) and ph-cli requires Node >= 24, while the runner
      # defaults to 22.
      - uses: actions/setup-node@v4
        with: { node-version: 24 }
      # vetra-deploy-action shells out to pnpm to publish the package, whatever
      # the repo itself uses, so pnpm has to be on PATH even though bun installs
      # the dependencies. A version is pinned because package.json declares no
      # packageManager field.
      - uses: pnpm/action-setup@v4
        with: { version: 9 }
      - uses: powerhouse-inc/vetra-deploy-action@v1
        with:
          app-id: ffdbb9c9-2fc5-408f-b034-6f78c7692449
          # The image installs the published package; nothing here needs a repo
          # build, and the Dockerfile does its own install.
          install-command: ''
          build-command: ''
          # @powerhousedao/knowledge-note is published upstream (latest 1.0.52).
          # This fork must not republish it: the registry refuses with
          # "not authorized to publish ... (owned by another user)".
          package-dirs: ''
          fusion-dockerfile: Dockerfile
          fusion-context: .
          fusion-image-name: knowledge-note
