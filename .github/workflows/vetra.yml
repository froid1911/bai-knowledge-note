name: Vetra
on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
    types: [opened, synchronize, reopened]
permissions:
  id-token: write
  contents: read
concurrency:
  group: vetra-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true
jobs:
  deploy:
    # Skip pull requests opened from another repository: they must not reach the
    # OIDC token. Compare full names rather than asking whether the head repo is
    # a fork, which is true for every PR when this repository is itself a fork.
    if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
      # bun installs the dependencies, but the build still runs Node tooling
      # (ph-cli, scripts/*.mjs) and ph-cli requires Node >= 24, while the runner
      # defaults to 22.
      - uses: actions/setup-node@v4
        with: { node-version: 24 }
      # vetra-deploy-action shells out to pnpm to publish the package, whatever
      # the repo itself uses, so pnpm has to be on PATH even though bun installs
      # the dependencies. A version is pinned because package.json declares no
      # packageManager field.
      - uses: pnpm/action-setup@v4
        with: { version: 9 }
      - uses: powerhouse-inc/vetra-deploy-action@v1
        with:
          app-id: ffdbb9c9-2fc5-408f-b034-6f78c7692449
          # A Powerhouse package: install with bun, build with ph-cli (the
          # `build` script), then the action packs and publishes it to the Vetra
          # registry and deploys it. Published as `bai-knowledge-note`: the
          # upstream name @powerhousedao/knowledge-note belongs to its owner.
          install-command: bun install --frozen-lockfile
          build-command: bun run build
          package-dirs: .
